name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/veriforge/ veriforge_lsp/
      - run: uv run python tools/check_overview.py

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra test
      - run: >
          uv run pytest
          tests/test_verilog_parser/test_all.py
          tests/test_model/test_module.py
          tests/test_model/test_instances.py
          tests/test_model/test_roundtrip.py
          tests/test_model/test_tree_to_model_characterization.py
          tests/test_analysis/test_width_inference.py
          tests/test_analysis/test_const_fold.py
          tests/test_preprocessor/test_preprocessor.py
          tests/test_formatter/test_formatter.py
          --tb=short -q

  sim-smoke:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra test
      # Excludes tests/test_sim/compiled/ (Cython, covered by weekly.yml) and
      # tests/test_dsl/ plus a handful of large cross-engine hardware-example
      # suites (ibex, darkriscv, structural_patterns, differential harness,
      # pulp_*) that individually run every test across multiple engines
      # including a fresh Cython "compiled" build — the full tests/test_sim/
      # tree measured ~33 min locally with -n 4, and adding tests/test_dsl/
      # pushed it to ~45 min, both far past a smoke job's ~10-minute budget.
      # This scope measured ~9 min locally; full coverage still runs via the
      # `test` job above and the weekly.yml full-regression workflow.
      - run: >
          uv run pytest tests/test_sim/
          --ignore=tests/test_sim/compiled
          --ignore=tests/test_sim/test_ibex_examples.py
          --ignore=tests/test_sim/test_darkriscv_constructs.py
          --ignore=tests/test_sim/test_structural_patterns.py
          --ignore=tests/test_sim/test_differential.py
          --ignore=tests/test_sim/test_pulp_ready_valid_examples.py
          --ignore=tests/test_sim/test_pulp_axi_examples.py
          --ignore=tests/test_sim/test_pulp_common_cells_examples.py
          -n 4 --tb=short -q

  vm-equivalence:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra test --extra bench
      - run: uv run python setup_cython.py build_ext --inplace
      - name: VM tests (Cython vm-fast extension built)
        run: uv run pytest tests/test_sim/test_vm.py tests/test_sim/test_bench_native.py -n auto -q
      - name: VM tests (pure-Python VM, extension disabled)
        run: uv run pytest tests/test_sim/test_vm.py tests/test_sim/test_bench_native.py -n auto -q
        env:
          VERIFORGE_DISABLE_CYTHON_VM: "1"
